# ============================================================
# ÓRBITA (SaaS da Nexus) — hospedagem no Netlify (ESPEC D10, §3.9, §9 passo 6)
# Publica a pasta web/ sem build. Em TODOS os hosts do site (o principal e
# os domínios das revendas/clientes) a raiz e o /index.html vão para /app/:
# o painel clássico, com a marca Nexus, só é servido pelo GitHub Pages.
# Cabeçalhos de segurança do app novo (/app/*): nenhum script inline, só
# o próprio site e o Supabase do projeto.
# ============================================================
[build]
  publish = "web"
  command = ""
  # Aceite F8 (01/10/2026): o dono autorizou a produção; a branch main publica normalmente.
  # (A antiga regra "ignore", que pulava o build da main até o aceite, foi retirada.)

[[redirects]]
  from = "/"
  to = "/app/"
  status = 302
  force = true

[[redirects]]
  from = "/index.html"
  to = "/app/"
  status = 302
  force = true

# Entradas independentes; compartilham a mesma sessão e os mesmos dados do app.
[[headers]]
  for = "/crm/*"
  [headers.values]
    Content-Security-Policy = "default-src 'none'; script-src 'self'; style-src 'self'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Content-Type-Options = "nosniff"

[[headers]]
  for = "/ads/*"
  [headers.values]
    Content-Security-Policy = "default-src 'none'; script-src 'self'; style-src 'self'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Content-Type-Options = "nosniff"

[[headers]]
  for = "/atendimento/*"
  [headers.values]
    Content-Security-Policy = "default-src 'none'; script-src 'self'; style-src 'self'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Content-Type-Options = "nosniff"

[[headers]]
  for = "/workspace.js"
  [headers.values]
    Content-Security-Policy = "default-src 'none'; script-src 'self'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Content-Type-Options = "nosniff"

[[headers]]
  for = "/app/*"
  [headers.values]
    Content-Security-Policy = "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; media-src 'self' blob: https://dtjznipitihnwmcgpzqh.supabase.co; connect-src 'self' https://dtjznipitihnwmcgpzqh.supabase.co; font-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Content-Type-Options = "nosniff"
    Permissions-Policy = "camera=(), geolocation=()"

# o app muda de versão pelo ?v= do index.html; o próprio index.html não fica em cache
[[headers]]
  for = "/app/index.html"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/app/"
  [headers.values]
    Cache-Control = "no-cache"

# ---- cache (M12, plano de 01/10/2026) ----
# O app muda de versão pelo ?v= do index.html (que não fica em cache), então os módulos e CSS com ?v= podem ficar para sempre.
# Netlify ignora a query: o mesmo arquivo com outro ?v= é o conteúdo novo, e o service worker guarda cada URL completa.
[[headers]]
  for = "/app/*.js"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/app/*.css"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# o service worker e o versao.json NUNCA ficam em cache (o navegador confere o sw.js a cada abertura; o versao.json diz se há versão nova)
# Estes dois blocos vêm DEPOIS dos de cima de propósito: sw.js também casa com /app/*.js e precisa vencer.
[[headers]]
  for = "/app/sw.js"
  [headers.values]
    Cache-Control = "no-cache"
    Service-Worker-Allowed = "/app/"

[[headers]]
  for = "/app/versao.json"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/app/*.webmanifest"
  [headers.values]
    Content-Type = "application/manifest+json"

[[headers]]
  for = "/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=2592000"
